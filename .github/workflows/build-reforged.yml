name: Reforged Hero Arena map build
on:
  push:
    branches:
      - feature/reforged-custom-hero-arena
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reforged-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate and pack Reforged MPQ map
        run: python tools/build_reforged.py --source . --output dist/Hero_Arena_Reforged.w3x
      - name: Upload complete map archive
        uses: actions/upload-artifact@v4
        with:
          name: Hero_Arena_Reforged
          path: dist/Hero_Arena_Reforged.w3x
